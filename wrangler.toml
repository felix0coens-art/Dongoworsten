# Cloudflare Worker voor Dongo Worsten: statische site uit public/ plus de API in src/.
name = "dongoworsten"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "public"
binding = "ASSETS"
# Deze paden gaan eerst langs de Worker (login-controle, API, foto's); de rest serveert Cloudflare rechtstreeks.
run_worker_first = ["/", "/index.html", "/api/*", "/beheer", "/beheer/*", "/fotos/*", "/worst/*", "/robots.txt", "/sitemap.xml", "/voorwaarden", "/privacy", "/mandje", "/bedankt"]

[[d1_databases]]
binding = "DB"
database_name = "dongoworsten"
database_id = "743df8be-551a-4da7-a8e3-4dc459587bb2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "dongoworsten-fotos"

[observability]
enabled = true

[vars]
# Het echte adres van de winkel (canonieke links, sitemap, doorsturen van workers.dev).
SITE_URL = "https://dongoworsten.be"
# Cloudflare Access: het teamdomein en de AUD-tag van de applicatie die het beheer beschermt.
ACCESS_TEAM_DOMAIN = "https://sparkling-mountain-a630.cloudflareaccess.com"
ACCESS_AUD = "2320ccf60f49057e59d9d59168e06b0d1c527114b08f9c866fb6694cfea78447"
# Geheimen (in Cloudflare, niet in de code): BEHEER_EMAILS (wie mag beheren, komma-gescheiden)
# en MOLLIE_API_KEY (test_… om te testen, live_… voor echte betalingen).
# BEHEER_EMAILS staat als geheim
# in Cloudflare (Worker > Settings > Variables and Secrets), niet in de code.
