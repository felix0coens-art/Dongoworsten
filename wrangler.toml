# Cloudflare Worker voor Dongo Worsten: statische site uit public/ plus de API in src/.
name = "dongoworsten"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "public"
binding = "ASSETS"
# Deze paden gaan eerst langs de Worker (login-controle, API, foto's); de rest serveert Cloudflare rechtstreeks.
run_worker_first = ["/api/*", "/beheer", "/beheer/*", "/fotos/*"]

[[d1_databases]]
binding = "DB"
database_name = "dongoworsten"
database_id = "743df8be-551a-4da7-a8e3-4dc459587bb2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "dongoworsten-fotos"

[observability]
enabled = true

[vars]
# Cloudflare Access: het teamdomein en de AUD-tag van de applicatie die het beheer beschermt.
ACCESS_TEAM_DOMAIN = "https://sparkling-mountain-a630.cloudflareaccess.com"
ACCESS_AUD = "c50ca792ef79bb21d2bbbd076c4415ea2c627cbae1213053266238b4028c7237"
# BEHEER_EMAILS (wie mag het beheer gebruiken, komma-gescheiden) staat als geheim
# in Cloudflare (Worker > Settings > Variables and Secrets), niet in de code.
